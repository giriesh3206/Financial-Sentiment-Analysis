# Data and File Paths
data_dir: "./data"
models_dir: "./models"
reports_dir: "./reports"
figures_dir: "./figures"

# Label mapping
labels:
  0: "Bearish"
  1: "Bullish"
  2: "Neutral"

# Training parameters for RNN & LSTM
rnn_lstm:
  embedding_dim: 100
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64
  epochs: 15
  early_stopping_patience: 3
  seed: 42
  max_len: 64

# Fine-tuning parameters for FinBERT
finbert:
  model_name: "ProsusAI/finbert"
  batch_size: 16
  epochs: 3
  learning_rate: 2e-5
  weight_decay: 0.01
  seed: 42
  max_len: 64
